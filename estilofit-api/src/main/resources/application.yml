server:
  port: ${APP_PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: estilofit-api

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estilofit_manager}
    username: ${DB_USERNAME:estilofit}
    password: ${DB_PASSWORD:estilofit123}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  jackson:
    # 'always' mantém campos null no JSON (ex: "salePrice": null), deixando o contrato
    # fiel aos tipos do frontend (number | null) e evitando campos "sumindo" da resposta.
    default-property-inclusion: always
    deserialization:
      fail-on-unknown-properties: false
    serialization:
      write-dates-as-timestamps: false
    time-zone: America/Sao_Paulo

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:28800}
    refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  swagger:
    enabled: ${SWAGGER_ENABLED:true}
  cookie:
    # Secure=true exige HTTPS. Em dev (HTTP) defina COOKIE_SECURE=false para o
    # refresh token funcionar; em produção mantenha true.
    secure: ${COOKIE_SECURE:true}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
    display-request-duration: true
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
    path: /v3/api-docs

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    br.com.estilofitudi: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

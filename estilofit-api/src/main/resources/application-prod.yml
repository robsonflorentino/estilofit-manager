# Perfil de produção — sobrescreve apenas o necessário.
# As credenciais e segredos vêm de variáveis de ambiente (ver application.yml).

spring:
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# Swagger desligado por padrão em produção (habilite com SWAGGER_ENABLED=true se precisar)
app:
  swagger:
    enabled: ${SWAGGER_ENABLED:false}

springdoc:
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}

logging:
  level:
    root: INFO
    br.com.estilofitudi: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

spring:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    secret: test-secret-key-for-integration-tests-estilofit-manager-2026-not-for-production
    access-token-expiration: 28800
    refresh-token-expiration: 604800
  cors:
    allowed-origins: http://localhost:5173
  swagger:
    enabled: false

logging:
  level:
    root: WARN
    br.com.estilofitudi: INFO

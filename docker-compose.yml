services:
  postgres:
    image: postgres:15-alpine
    container_name: estilofit_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: estilofit_manager
      POSTGRES_USER: estilofit
      POSTGRES_PASSWORD: estilofit123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estilofit -d estilofit_manager"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Encaminha as chamadas de API para o backend (mesma origem, sem CORS).
    # O context-path da API é /api/v1, preservado no proxy.
    location /api/ {
        proxy_pass         http://api:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # SPA: qualquer rota que não seja arquivo cai no index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache dos assets com hash no nome
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
